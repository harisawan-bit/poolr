[package]
name = "poolr"
version = "0.5.2"
description = "poolr — free, no-code desktop app for Systematic Reviews & Meta-Analyses (PRISMA 2020)"
authors = ["M. Haris Awan <m.harisawan@icloud.com>"]
license = "MIT"
repository = "https://github.com/harisawan-bit/poolr"
homepage = "https://github.com/harisawan-bit/poolr"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "poolr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["jobapi2", "processthreadsapi", "winnt", "handleapi", "winbase"] }
