name: Build Installer (any branch, artifact only)

# Builds the Windows installer for whatever branch is pushed and uploads it as a
# workflow artifact. This NEVER creates a GitHub Release and NEVER tags — it is
# purely a way to get a downloadable .exe/.msi installer from a branch before it
# is merged or released. Release publishing stays in build.yml (tag-gated only).

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DOTNET_VERSION: "8.0.x"
  RUST_VERSION: "stable"

jobs:
  installer-windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Rust (msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Frontend deps (includes @tauri-apps/cli)
        working-directory: frontend
        run: npm ci

      # Build the frontend bundle explicitly (frontend/dist). tauri.conf.json's
      # beforeBuildCommand (`npm run build`) assumes cwd=frontend; because we invoke
      # the Tauri CLI with cwd=src-tauri below, we build the frontend here and then
      # override beforeBuildCommand to empty so the CLI doesn't try to re-run npm.
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # Publish the self-contained C# engine into src-tauri/resources/engine so the
      # Tauri build script (which bundles that folder) finds it. The folder is
      # gitignored, so it must be (re)published in this job before the Tauri build.
      - name: Build self-contained C# sidecar
        working-directory: engine
        run: dotnet publish Poolr.Engine.Api/Poolr.Engine.Api.csproj -c Release -r win-x64 --self-contained true -o ../src-tauri/resources/engine

      # Build the installer directly with the Tauri CLI. The CLI is installed by the
      # frontend (@tauri-apps/cli -> frontend/node_modules/@tauri-apps/cli/tauri.js);
      # there is no separate src-tauri npm project. We run the CLI with cwd=src-tauri
      # (where tauri.conf.json lives and the project is discovered) and merge an
      # inline -c config that empties beforeBuildCommand (frontend already built).
      # No release, no tag — artifact only.
      - name: Tauri build (Windows installer)
        working-directory: src-tauri
        run: node ../frontend/node_modules/@tauri-apps/cli/tauri.js build --target x86_64-pc-windows-msvc --bundles nsis msi -c tauri.ci-no-before-build.json
        env:
          CI: true

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poolr-installer-${{ github.ref_name }}-x64
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14
