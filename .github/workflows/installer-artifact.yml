name: Build Installer (any branch, artifact only)

# Builds the Windows installer for whatever branch is pushed and uploads it as a
# workflow artifact. This NEVER creates a GitHub Release and NEVER tags — it is
# purely a way to get a downloadable .exe/.msi installer from a branch before it
# is merged or released. Release publishing stays in build.yml (tag-gated only).

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DOTNET_VERSION: "8.0.x"
  RUST_VERSION: "stable"

jobs:
  installer-windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Rust (msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      - name: Tauri CLI deps (src-tauri)
        working-directory: src-tauri
        run: npm ci

      # Publish the self-contained C# engine into src-tauri/resources/engine so the
      # Tauri build script (which bundles that folder) finds it. The folder is
      # gitignored, so it must be (re)published in this job before the Tauri build.
      - name: Build self-contained C# sidecar
        working-directory: engine
        run: dotnet publish Poolr.Engine.Api/Poolr.Engine.Api.csproj -c Release -r win-x64 --self-contained true -o ../src-tauri/resources/engine

      - name: Tauri build (installers)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tauriScript: npm run tauri
          args: --target x86_64-pc-windows-msvc
          # tauri-action tries to publish a release when tagName is set; leaving it
          # unset keeps this job to build+upload only.
          releaseId: ""

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poolr-installer-${{ github.ref_name }}-x64
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14
