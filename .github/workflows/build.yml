name: Build & Release (web overhaul)

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  DOTNET_VERSION: "8.0.x"
  RUST_VERSION: "stable"

jobs:
  # ── Python suite = engine-parity oracle (C# port must match these numbers) ──
  python-tests:
    name: Python Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q --ignore=tests/gui_smoke_test.py

  # ── New stack compile gate (runs on every PR) ──
  web-build:
    name: Web Stack Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: C# engine build
        working-directory: engine
        run: dotnet build Poolr.Engine.Api/Poolr.Engine.Api.csproj -c Release

      # Publish the self-contained sidecar into src-tauri/resources/engine so the
      # Tauri build script (which maps that folder as a bundle resource) finds it.
      # The folder is gitignored, so every job that runs `cargo check`/`cargo build`
      # must (re)publish it first — the release job does the same for tagged builds.
      - name: Publish C# sidecar (win-x64) into resources
        working-directory: engine
        run: dotnet publish Poolr.Engine.Api/Poolr.Engine.Api.csproj -c Release -r win-x64 --self-contained true -o ../src-tauri/resources/engine

      - name: Tauri cargo check
        working-directory: src-tauri
        run: cargo check

  # ── Native installers (tagged release only — heavy 6-OS build) ──
  release:
    name: Native Installers (${{ matrix.os }})
    needs: [python-tests, web-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            rid: win-x86
            arch: x86
            target: i686-pc-windows-msvc
          - os: windows-latest
            rid: win-arm64
            arch: arm64
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            rid: osx-x64
            arch: x64
            target: x86_64-apple-darwin
          - os: macos-latest
            rid: osx-arm64
            arch: arm64
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            rid: linux-x64
            arch: x64
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Install frontend deps so @tauri-apps/cli is available for `npm exec tauri`
      # (the native build invokes the Tauri CLI from frontend/node_modules).
      - name: Frontend deps (install Tauri CLI)
        working-directory: frontend
        run: npm ci

      - name: Linux deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build self-contained C# sidecar
        working-directory: engine
        run: dotnet publish Poolr.Engine.Api/Poolr.Engine.Api.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o ../src-tauri/resources/engine

      - name: Tauri build (native installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tauriScript: npm exec tauri
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poolr-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: ignore

  publish:
    name: Publish Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('poolr {0}', github.ref_name) || 'Nightly Build' }}
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: artifacts/**/*
