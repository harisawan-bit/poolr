name: Poolr checks and installers
on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update && sudo apt-get install -y rclone
      - run: dotnet test engine/Poolr.Engine.Tests/Poolr.Engine.Tests.csproj -c Release
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run test -- --run && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: python3 scripts/bundle-rclone.py --check
  installers:
    needs: checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, rid: win-x64, target: x86_64-pc-windows-msvc}
          - {os: windows-latest, rid: win-x86, target: i686-pc-windows-msvc}
          - {os: windows-latest, rid: win-arm64, target: aarch64-pc-windows-msvc}
          - {os: macos-latest, rid: osx-x64, target: x86_64-apple-darwin}
          - {os: macos-latest, rid: osx-arm64, target: aarch64-apple-darwin}
          - {os: ubuntu-22.04, rid: linux-x64, target: x86_64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix frontend
      - run: dotnet publish engine/Poolr.Engine.Api/Poolr.Engine.Api.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o src-tauri/resources/engine
      - run: python scripts/bundle-rclone.py ${{ matrix.rid }} src-tauri/resources/engine
      - name: Exclude optional LTTng profiler from portable Linux runtime
        if: runner.os == 'Linux'
        run: rm -f src-tauri/resources/engine/libcoreclrtraceptprovider.so
      - name: Build signed installers into draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
        with:
          retryAttempts: 3
          projectPath: .
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }}
          tagName: v0.6.4
          releaseName: Poolr v0.6.4
          releaseBody: 'Drive collaboration and workspace redesign. See docs/RELEASE_0.6.4.md for setup, signing-key migration and verification limits.'
          releaseDraft: true
          prerelease: false
      - name: Verify AppImage excludes the incompatible Wayland client library
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: python3 scripts/check-appimage.py src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: poolr-${{ matrix.rid }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error
