[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poolr"
version = "0.3.3"
description = "Standalone GUI for systematic reviews and meta-analyses"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "customtkinter>=5.2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "python-docx>=1.1",
    "biopython>=1.83",
    "pylatex>=1.4",
    "reportlab>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.0",
    "ruff>=0.1",
    "pyinstaller>=6.0",
]

[project.scripts]
poolr = "poolr:main"
poolr-cli = "poolr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/gui_smoke_test.py" = ["E402"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
follow_imports = "normal"
warn_unused_ignores = false
